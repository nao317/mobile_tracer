# Real Firebase project: Web configuration comes from .env; credentials stay server-only.
services:
  backend:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE:?Set path to untracked Firebase Admin service account JSON}
        target: /run/secrets/firebase-admin.json
        read_only: true
        bind:
          create_host_path: false
