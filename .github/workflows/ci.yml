name: CI

# pushは更新先、pull_requestはマージ先がmain/developの場合に起動する。
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# チェックアウトに必要な読み取り権限だけを付与する。
permissions:
  contents: read

# runステップは原則frontendで実行する。ルートやbackendを使うジョブは上書きする。
# usesステップのファイル指定（例: cache-dependency-path）はリポジトリルート基準。
defaults:
  run:
    working-directory: frontend

# quality・e2e・detectは並列実行し、detectの結果でbackendを有効にする。
# integrationはGoの検証後にローカルTapyrus環境を検証する。
jobs:
  # 現在のフロントエンドを常に検証する、CIの基本ジョブ。
  quality:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # セキュリティ修正版24.22.1を下限とし、24系の最新リリースを取得する。
          node-version: '>=24.22.1 <25'
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # lockfileどおりに依存を復元し、静的解析・単体テスト・ビルドを確認する。
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 本番ビルドを起動し、Chromiumで画面を検証する。
  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # qualityと同じNode.jsのバージョン条件を使う。
          node-version: '>=24.22.1 <25'
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # 段階的な実装に対応するため、任意ジョブの実行条件を一か所で判定する。
  # ファイルやスクリプトの存在確認のみを行い、実際の検証は各ジョブに任せる。
  detect:
    name: Detect implementation
    runs-on: ubuntu-latest

    # workflow全体のfrontend指定を上書き
    defaults:
      run:
        working-directory: .

    # GitHub Actionsのジョブ出力は文字列なので、利用側では'true'と比較する。
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      integration: ${{ steps.check.outputs.integration }}

    steps:
      - uses: actions/checkout@v7

      - name: Check required files
        id: check
        shell: bash
        run: |
          backend=false

          # GoモジュールとAPIエントリーポイントが揃ったらGo検証を有効にする。
          if [[ -f backend/go.mod &&
                -f backend/cmd/api/main.go ]]; then
            backend=true
          fi

          # Goの実装があることを前提にする
          integration="$backend"

          # 結合テストにはGo実装に加えて、Compose・イメージ定義・確認スクリプトが必要。
          # 今後ファイル構成を変える場合は、この一覧と実行ステップを合わせて更新する。
          required_files=(
            "compose.yaml"
            "backend/Dockerfile"
            "backend/cmd/tapyrus-check/main.go"
            "docker/tapyrus/init.sh"
            "docker/tapyrus/bootstrap.sh"
            "scripts/init.sh"
            "scripts/smoke.py"
            "scripts/db-smoke.py"
            "scripts/tapyrus-smoke.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Integration not ready: $file is missing"
              integration=false
            fi
          done

          # このステップの出力を、上記outputs経由で後続ジョブへ渡す。
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"

  # backend/go.modとcmd/api/main.goの存在により有効になる。
  backend:
    name: Go checks
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: mobile_tracer_test
          POSTGRES_USER: mobiletracer
          POSTGRES_PASSWORD: "ci-only p@ss /'\\?=#"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobiletracer -d mobile_tracer_test"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      TEST_DATABASE: "1"
      DB_HOST: 127.0.0.1
      POSTGRES_DB: mobile_tracer_test
      POSTGRES_USER: mobiletracer
      POSTGRES_PASSWORD: "ci-only p@ss /'\\?=#"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Goのバージョンと依存キャッシュはバックエンド側の定義に合わせる。
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)

          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      # 静的解析、競合検出付きテスト、APIバイナリのビルドを順に確認する。
      # -count=1でテストキャッシュを使わず、その実行での結果を得る。
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/api ./cmd/tapyrus-check

  # Compose上でサービス間接続とTapyrusトランザクションを確認する。
  integration:
    # GitHubの必須チェック名と一致させるため、この表示名を維持する。
    name: Integration checks

    # Tapyrusの検証はフロントエンドの検証と独立して実行する。
    needs: [detect, backend]

    # !cancelled()により、依存ジョブのスキップでこの条件自体が省略されるのを防ぐ。
    # backendの成功と結合用ファイルの存在を必須にする。
    if: >-
      ${{ !cancelled() &&
          needs.detect.result == 'success' &&
          needs.detect.outputs.integration == 'true' &&
          needs.backend.result == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v7

      # devモードの鍵・ジェネシス・ウォレットと検証用コインを用意する。
      - name: Initialize local Tapyrus
        run: bash scripts/init.sh

      - name: Validate Compose
        run: docker compose config --quiet

      # 起動完了を最大180秒待つ。サービスの準備状態はComposeのhealthcheckで定義する。
      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 180

      - name: Check application connections
        run: python3 scripts/smoke.py

      - name: Check DB outage and recovery
        run: python3 scripts/db-smoke.py

      - name: Check Tapyrus transaction
        run: python3 scripts/tapyrus-smoke.py

      # マイグレーションを空のDBに流し直し、制約のテストをする。
      - name: Check DB migrations
        run: docker compose run --rm db-test

      - name: Check initialization is repeatable
        run: |
          before=$(docker compose exec -T backend /app/tapyrus-check)
          bash scripts/init.sh
          after=$(docker compose exec -T backend /app/tapyrus-check)
          test "$before" = "$after"

      # 失敗時は原因調査用のログを残し、後片付けは成功・失敗にかかわらず試みる。
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
