services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    # Keep this longer than SHUTDOWN_TIMEOUT when changing the shutdown limit.
    stop_grace_period: ${BACKEND_STOP_GRACE_PERIOD:-15s}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
