# Only cloudflared can reach this listener from the dedicated tunnel network.
# Cloudflare sets X-Forwarded-Proto; never expose this config on a host port.
include /etc/nginx/mobile-tracer/http.conf;

map $http_x_forwarded_proto $external_scheme {
    default https;
    http http;
    https https;
}

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log without_query;
    # Also handle HTTP if the edge redirect has not yet been configured.
    if ($external_scheme = http) {
        return 308 https://$host$request_uri;
    }
    include /etc/nginx/mobile-tracer/server.conf;
}
