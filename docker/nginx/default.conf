# Docker DNS follows upstream container IP changes after recreation.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream api {
    zone api 64k;
    server backend:8080 resolve;
}

upstream web {
    zone web 64k;
    server frontend:3000 resolve;
}

map $http_host $original_host {
    default $http_host;
    "" $host;
}

server {
    listen 8080;
    server_name _;

    # Replace client-supplied forwarding headers at this HTTP boundary.
    proxy_set_header Host $original_host;
    proxy_set_header X-Forwarded-Host $original_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Protocol "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Url-Scheme "";
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    proxy_intercept_errors off;

    # Nginx itself is checked separately from /api/ready.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://api;
    }

    # No URI suffix: preserve /api/, the remaining path and the query string.
    location ^~ /api/ {
        proxy_pass http://api;
    }

    location / {
        proxy_buffering off;
        proxy_pass http://web;
    }
}
