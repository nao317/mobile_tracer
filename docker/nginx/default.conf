# Docker DNS follows upstream container IP changes after recreation.
# Query strings can contain OAuth authorization codes. Do not put them in logs.
log_format without_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream api {
    zone api 64k;
    server backend:8080 resolve;
}

upstream web {
    zone web 64k;
    server frontend:3000 resolve;
}

map $http_host $original_host {
    default $http_host;
    "" $host;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 11m;
    access_log /var/log/nginx/access.log without_query;

    # Replace client-supplied forwarding headers at this HTTP boundary.
    proxy_set_header Host $original_host;
    proxy_set_header X-Forwarded-Host $original_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Protocol "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Url-Scheme "";
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    proxy_intercept_errors off;

    # Nginx itself is checked separately from /api/ready.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://api;
    }

    # Upstream error messages can contain the original URI, including an OAuth code.
    # This endpoint uses the sanitized access log and Go authentication audit instead.
    location = /api/auth/google/callback {
        error_log /dev/null;
        proxy_pass http://api;
    }

    # No URI suffix: preserve /api/, the remaining path and the query string.
    location ^~ /api/ {
        proxy_pass http://api;
    }

    location / {
        proxy_buffering off;
        proxy_pass http://web;
    }
}
