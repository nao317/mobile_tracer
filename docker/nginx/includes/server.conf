    # Replace client-supplied forwarding headers at this HTTP boundary.
    proxy_set_header Host $original_host;
    proxy_set_header X-Forwarded-Host $original_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Protocol "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Url-Scheme "";
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    proxy_intercept_errors off;

    # Nginx itself is checked separately from /api/ready.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://api;
    }

    # Upstream error messages can contain the original URI, including an OAuth code.
    # This endpoint uses the sanitized access log and Go authentication audit instead.
    location = /api/auth/google/callback {
        error_log /dev/null;
        proxy_pass http://api;
    }

    # No URI suffix: preserve /api/, the remaining path and the query string.
    location ^~ /api/ {
        proxy_pass http://api;
    }

    location / {
        proxy_buffering off;
        proxy_pass http://web;
    }
