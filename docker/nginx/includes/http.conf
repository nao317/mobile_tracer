# Docker DNS follows upstream container IP changes after recreation.
# Query strings can contain OAuth authorization codes. Do not put them in logs.
log_format without_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream api {
    zone api 64k;
    server backend:8080 resolve;
}

upstream web {
    zone web 64k;
    server frontend:3000 resolve;
}

map $http_host $original_host {
    default $http_host;
    "" $host;
}

