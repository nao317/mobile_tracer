<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="提出版と相手の回答を別に保存">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#334155} .label{font-size:34px;font-weight:700}.small{font-size:27px}.note{font-size:29px}</style>
<rect x="35" y="75" width="250" height="125" rx="14" fill="white" stroke="#2c67e5" stroke-width="3"/>
<text x="160.0" y="149.5" class="label" text-anchor="middle">下書き</text>
<rect x="375" y="75" width="250" height="125" rx="14" fill="white" stroke="#2c67e5" stroke-width="3"/>
<text x="500.0" y="132.5" class="label" text-anchor="middle">提出v1</text>
<text x="500.0" y="175.5" class="small" text-anchor="middle">内容を固定</text>
<rect x="715" y="75" width="250" height="125" rx="14" fill="white" stroke="#2c67e5" stroke-width="3"/>
<text x="840.0" y="132.5" class="label" text-anchor="middle">提出v2</text>
<text x="840.0" y="175.5" class="small" text-anchor="middle">元版を残す</text>
<path d="M288 138 L363 138" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M628 138 L703 138" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="330" y="107" class="small" text-anchor="middle">提出</text>
<text x="670" y="50" class="small" text-anchor="middle">訂正・補足</text>
<path d="M500 204 L500 268" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="250" class="small" text-anchor="middle">回答は別に保存</text>
<rect x="35" y="300" width="250" height="120" rx="14" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="160.0" y="372.0" class="label" text-anchor="middle">同意</text>
<rect x="375" y="300" width="250" height="120" rx="14" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="500.0" y="372.0" class="label" text-anchor="middle">拒否</text>
<rect x="715" y="300" width="250" height="120" rx="14" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="840.0" y="372.0" class="label" text-anchor="middle">未回答</text>
<path d="M500 282 L160 292" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M500 282 L840 292" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="485" width="860" height="90" rx="12" fill="#fff4df" stroke="#c99748" stroke-width="2"/>
<text x="500" y="542" class="label" text-anchor="middle" style="fill:#99621b">v1の署名はv2に流用しない</text>
</svg>
