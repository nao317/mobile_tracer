<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="当初見積と追加作業の承認を分ける">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#334155} .label{font-size:34px;font-weight:700}.small{font-size:27px}.note{font-size:29px}</style>
<rect x="30" y="30" width="450" height="95" rx="14" fill="white" stroke="#2c67e5" stroke-width="3"/>
<text x="255.0" y="89.5" class="label" text-anchor="middle">入庫記録</text>
<path d="M255 129 L255 165" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="175" width="450" height="95" rx="14" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="255.0" y="234.5" class="label" text-anchor="middle">見積提示・承認</text>
<path d="M255 274 L255 310" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="320" width="450" height="95" rx="14" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="255.0" y="379.5" class="label" text-anchor="middle">承認済み範囲の作業</text>
<path d="M255 419 L255 455" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="465" width="450" height="95" rx="14" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="255.0" y="524.5" class="label" text-anchor="middle">引き渡し</text>
<rect x="600" y="110" width="365" height="95" rx="14" fill="#fff4df" stroke="#99621b" stroke-width="3"/>
<text x="782.5" y="169.5" class="label" text-anchor="middle">追加作業の提示</text>
<rect x="600" y="270" width="365" height="95" rx="14" fill="#fff4df" stroke="#99621b" stroke-width="3"/>
<text x="782.5" y="329.5" class="label" text-anchor="middle">追加承認待ち</text>
<path d="M782 209 L782 257" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M484 367 L585 157" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M595 317 L495 367" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="782" y="430" class="note" text-anchor="middle" style="fill:#99621b">承認した範囲だけ</text>
<text x="548" y="415" class="small" text-anchor="middle" style="fill:#99621b">承認後</text>
<text x="782" y="480" class="note" text-anchor="middle" style="fill:#99621b">作業へ進める</text>
