map $http_x_load_phase $load_phase {
    default other;
    business business;
}
log_format load_metrics '$request_method $status $upstream_addr $request_time $load_phase';
access_log /var/log/nginx/access.log load_metrics;
error_log /dev/null;
resolver 127.0.0.11 valid=2s ipv6=off;
resolver_timeout 2s;

upstream load_api {
    zone load_api 64k;
    server backend:8080 resolve max_fails=1 fail_timeout=2s;
}
upstream load_web {
    zone load_web 64k;
    server frontend:3000 resolve;
}
upstream load_auth {
    zone load_auth 64k;
    server firebase-auth:9099 resolve;
}

proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Protocol "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Url-Scheme "";
proxy_set_header Connection "";
proxy_http_version 1.1;
proxy_connect_timeout 2s;
proxy_read_timeout 15s;
proxy_next_upstream off;

server {
    listen 8080;
    client_max_body_size 11m;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location = /api { proxy_pass http://load_api; }
    location ^~ /api/ { proxy_pass http://load_api; }
    location / { proxy_buffering off; proxy_pass http://load_web; }
}

server {
    listen 8081;
    location / { proxy_pass http://load_api; }
}

server {
    listen 9099;
    access_log off;
    location / { proxy_pass http://load_auth; }
}
